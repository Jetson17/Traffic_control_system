<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traffic Signal Control System</title>
  <meta name="description" content="Traffic Signal Control System using Circular Queues, Priority Scheduling, and Graph-Based Traffic Flow Analysis.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <header class="top-navbar">
    <div class="brand-section">
      <div class="brand-title-group">
        <h1>Traffic Signal Control System</h1>
      </div>
    </div>
  </header>

  <nav class="dashboard-tabs" role="tablist" aria-label="Dashboard sections">
    <button class="dashboard-tab active" id="tab-simulation" type="button" role="tab"
      aria-selected="true" aria-controls="panel-simulation" data-tab="simulation">Simulation</button>
    <button class="dashboard-tab" id="tab-queue" type="button" role="tab"
      aria-selected="false" aria-controls="panel-queue" data-tab="queue" tabindex="-1">Circular Queue</button>
    <button class="dashboard-tab" id="tab-graph" type="button" role="tab"
      aria-selected="false" aria-controls="panel-graph" data-tab="graph" tabindex="-1">Graph Analysis</button>
    <button class="dashboard-tab" id="tab-comparison" type="button" role="tab"
      aria-selected="false" aria-controls="panel-comparison" data-tab="comparison" tabindex="-1">Comparison</button>
  </nav>

  <main class="dashboard-container">

    <section class="tab-panel simulation-panel" id="panel-simulation" role="tabpanel"
      aria-labelledby="tab-simulation" data-panel="simulation">
    <section class="control-bar" id="section-controls">
      <div class="control-buttons-group">
        <button id="btn-start" class="btn btn-primary" title="Start or resume simulation">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Start
        </button>
        <button id="btn-pause" class="btn btn-warning" title="Pause simulation clock" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          Pause
        </button>
        <button id="btn-reset" class="btn btn-danger" title="Reset simulation state">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Reset
        </button>
      </div>

    </section>

    <!-- Section B: Traffic Performance Statistics Cards -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-title">Vehicles Waiting</span>
        <div class="stat-value" id="stat-total-waiting">0</div>
      </div>

      <div class="stat-card">
        <span class="stat-title">Vehicles Served</span>
        <div class="stat-value" id="stat-total-served">0</div>
      </div>

      <div class="stat-card">
        <span class="stat-title">Average Waiting Time</span>
        <div class="stat-value" id="stat-avg-wait">0.0s</div>
      </div>
    </section>

    <!-- Section C & D: Four-Way Traffic Intersection + Vehicle Management -->
    <div class="simulation-main-grid" id="section-intersection">

      <!-- Left Column: Central 4-Way Visual Intersection -->
      <div class="card">
        <div class="card-header">
          <div class="card-title-group">
            <h2>Traffic Intersection</h2>
          </div>
        </div>

        <div class="intersection-container">
          <div class="intersection-stage" id="intersection-stage">
            
            <!-- Road Surfaces -->
            <div class="road-v"></div>
            <div class="road-h"></div>
            <div class="road-center-junction"></div>

            <!-- Road Center Dividers -->
            <div class="road-divider-v-top"></div>
            <div class="road-divider-v-bottom"></div>
            <div class="road-divider-h-left"></div>
            <div class="road-divider-h-right"></div>

            <span class="direction-label direction-north" aria-hidden="true">N</span>
            <span class="direction-label direction-east" aria-hidden="true">E</span>
            <span class="direction-label direction-south" aria-hidden="true">S</span>
            <span class="direction-label direction-west" aria-hidden="true">W</span>

            <!-- Pedestrian Crosswalks -->
            <div class="crosswalk-north"></div>
            <div class="crosswalk-south"></div>
            <div class="crosswalk-west"></div>
            <div class="crosswalk-east"></div>

            <!-- Pavement Stop Lines (Vehicles must stop behind these) -->
            <div class="stop-line stop-line-north" title="North Stop Line"></div>
            <div class="stop-line stop-line-south" title="South Stop Line"></div>
            <div class="stop-line stop-line-west" title="West Stop Line"></div>
            <div class="stop-line stop-line-east" title="East Stop Line"></div>

            <!-- 4 Physical Traffic Lights Fixtures -->
            <!-- North Light -->
            <div class="traffic-light-fixture vertical light-north" id="light-north">
              <div class="light-bulb bulb-red active"></div>
              <div class="light-bulb bulb-yellow"></div>
              <div class="light-bulb bulb-green"></div>
            </div>

            <!-- South Light -->
            <div class="traffic-light-fixture vertical light-south" id="light-south">
              <div class="light-bulb bulb-red active"></div>
              <div class="light-bulb bulb-yellow"></div>
              <div class="light-bulb bulb-green"></div>
            </div>

            <!-- East Light -->
            <div class="traffic-light-fixture horizontal light-east" id="light-east">
              <div class="light-bulb bulb-red active"></div>
              <div class="light-bulb bulb-yellow"></div>
              <div class="light-bulb bulb-green"></div>
            </div>

            <!-- West Light -->
            <div class="traffic-light-fixture horizontal light-west" id="light-west">
              <div class="light-bulb bulb-red active"></div>
              <div class="light-bulb bulb-yellow"></div>
              <div class="light-bulb bulb-green"></div>
            </div>

            <!-- Dedicated Scrollable Road Queues (Behind Stop Lines) -->
            <div class="lane-queue-area lane-north" id="lane-north" data-dir="North"></div>
            <div class="lane-queue-area lane-south" id="lane-south" data-dir="South"></div>
            <div class="lane-queue-area lane-east" id="lane-east" data-dir="East"></div>
            <div class="lane-queue-area lane-west" id="lane-west" data-dir="West"></div>

            <!-- Active Vehicle Crossing Animation Layer -->
            <div class="intersection-crossing-layer" id="intersection-crossing-layer"></div>

          </div>
        </div>
      </div>

      <!-- Right Column: Vehicle Management & Directional Queues -->
      <div class="card">
        <div class="card-header">
          <div class="card-title-group">
            <h2>Vehicle Queue</h2>
          </div>
        </div>

        <!-- Manual Dispatcher Controls -->
        <div class="vehicle-dispatcher-bar">
          <select id="dispatch-direction-select" class="input-select" aria-label="Vehicle direction">
            <option value="North">North</option>
            <option value="East">East</option>
            <option value="South">South</option>
            <option value="West">West</option>
          </select>

          <select id="dispatch-type-select" class="input-select" aria-label="Vehicle type">
            <option value="Car">Car</option>
            <option value="Bus">Bus</option>
            <option value="Truck">Truck</option>
            <option value="Bike">Bike</option>
            <option value="Ambulance">Ambulance</option>
            <option value="Fire Engine">Fire Engine</option>
            <option value="Police Vehicle">Police Vehicle</option>
          </select>

          <div class="dispatch-actions">
            <button id="btn-dispatch-vehicle" class="btn btn-primary">Add Vehicle</button>
            <button id="btn-dispatch-emergency" class="btn btn-danger">Emergency Vehicle</button>
          </div>
        </div>

        <!-- Directional Queue Tabs -->
        <div class="queue-tabs-nav">
          <button class="queue-tab-btn active" data-direction="North">North</button>
          <button class="queue-tab-btn" data-direction="East">East</button>
          <button class="queue-tab-btn" data-direction="South">South</button>
          <button class="queue-tab-btn" data-direction="West">West</button>
        </div>

        <!-- Waiting Vehicles List -->
        <div class="queue-list-container" id="queue-items-list">
          <div class="queue-empty-placeholder">Loading directional queues...</div>
        </div>

      </div>

    </div>

    </section>

    <section class="tab-panel queue-panel" id="panel-queue" role="tabpanel"
      aria-labelledby="tab-queue" data-panel="queue" hidden>
    <section class="circular-queue-visualizer-card" id="section-dsa-queues">
      <div class="queue-panel-header">
        <div class="card-title-group">
          <h2>Circular Queue</h2>
        </div>
        <div class="queue-direction-select">
          <select id="dsa-visualizer-select" class="input-select" aria-label="Queue direction">
            <option value="North">North Queue</option>
            <option value="East">East Queue</option>
            <option value="South">South Queue</option>
            <option value="West">West Queue</option>
          </select>
        </div>
      </div>

      <!-- Telemetry row for Circular Queue -->
      <div class="queue-metrics">
        <div><span>Front</span><strong id="dsa-front-val">-1</strong></div>
        <div><span>Rear</span><strong id="dsa-rear-val">-1</strong></div>
      </div>

      <div class="queue-activity" id="wrap-around-notice" aria-live="polite"></div>

      <!-- 8-Slot Fixed Array Visualization -->
      <div class="array-slots-grid" id="array-slots-grid">
        <!-- Rendered by script.js -->
      </div>
    </section>

    </section>

    <section class="tab-panel graph-panel" id="panel-graph" role="tabpanel"
      aria-labelledby="tab-graph" data-panel="graph" hidden>
    <section class="card" id="section-graph-network">
      <div class="card-header">
        <div class="card-title-group">
          <h2>Road Network</h2>
        </div>
      </div>

      <div class="graph-route-grid">

        <!-- Left: Interactive SVG Road Network -->
        <div class="graph-canvas-box">
          <svg class="graph-svg" id="city-traffic-svg" viewBox="0 0 600 420"></svg>
        </div>

        <!-- Right: Route Planning & Traversal Controls -->
        <div class="route-form">
          <div class="form-group">
            <label class="form-label" for="route-source-select">Origin</label>
            <select id="route-source-select" class="input-select"></select>
          </div>

          <div class="form-group">
            <label class="form-label" for="route-target-select">Destination</label>
            <select id="route-target-select" class="input-select"></select>
          </div>

          <div class="form-group">
            <span class="form-label">Algorithm</span>
            <div class="route-algorithm-options">
              <label class="route-algorithm-option">
                <input type="radio" name="route-algo" value="bfs" checked> BFS
              </label>
            </div>
          </div>

          <button id="btn-calculate-route" class="btn btn-primary">
            Calculate Route
          </button>

          <!-- Route Output Container -->
          <div class="route-result-box" id="route-result-container"></div>
        </div>

      </div>
    </section>

    </section>

    <section class="tab-panel comparison-panel" id="panel-comparison" role="tabpanel"
      aria-labelledby="tab-comparison" data-panel="comparison" hidden>
    <section class="card" id="section-comparison">
      <div class="card-header">
        <div class="card-title-group">
          <h2>Comparison</h2>
        </div>
      </div>

      <div class="comparison-table-wrapper" id="comparison-table-content">
        <div style="color:var(--text-dim); padding:1rem; text-align:center;">Loading comparison…</div>
      </div>
    </section>
    </section>

  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
